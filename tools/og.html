<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Editable source for assets/img/og-image.png (1200×630).
     Regenerate: npx playwright screenshot --viewport-size=1200,630 --wait-for-timeout=500 tools/og.html og-image.png
     (from the tools/ directory) */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #F7FBF9 0%, #DDEFE7 62%, #CDE9DB 100%);
    color: #17241F;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
    position: relative;
  }
  .road {
    position: absolute; left: 0; right: 0; bottom: 64px; height: 2px;
    background: repeating-linear-gradient(90deg, #18715B 0 26px, transparent 26px 44px);
    opacity: .35;
  }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: #0D513F; margin-bottom: 26px;
  }
  .eyebrow::before { content: ""; width: 34px; height: 3px; background: #18715B; border-radius: 2px; }
  h1 { font-size: 66px; line-height: 1.08; letter-spacing: -.02em; font-weight: 800; }
  p { margin-top: 22px; font-size: 25px; line-height: 1.45; color: #36564C; }
  .meta { margin-top: 30px; display: flex; gap: 14px; flex-wrap: wrap; }
  .pill {
    font-size: 17px; font-weight: 600; color: #0D513F;
    background: rgba(255,255,255,.75); border: 1px solid rgba(24,113,91,.25);
    padding: 8px 16px; border-radius: 999px;
  }
  .device {
    flex: none; width: 300px; height: 520px; border-radius: 40px;
    background: #fff; border: 1px solid rgba(24,113,91,.18);
    box-shadow: 0 30px 60px rgba(23,76,58,.18), 0 4px 14px rgba(23,76,58,.10);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .device img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
</style>
</head>
<body>
  <div class="copy">
    <div class="eyebrow">Fillo — Car Expense Tracker</div>
    <h1>Know what your car will cost next.</h1>
    <p>Fuel, charging, maintenance, documents, and upcoming costs — kept together, privately on your iPhone.</p>
    <div class="meta">
      <span class="pill">Paid once</span>
      <span class="pill">No account</span>
      <span class="pill">No subscription</span>
      <span class="pill">Offline</span>
    </div>
  </div>
  <div class="device"><img src="../assets/img/og-shot.webp" alt=""></div>
  <div class="road"></div>
</body>
</html>
